# Config XenonRecomp — Islands of Wakfu (XBLA 584109AA) + Title Update #2.
# Chemins relatifs à ce fichier ; `work` (racine du dépôt) est un lien ignoré par Git vers
# l'espace de travail (voir README). Les fichiers du jeu ne sont jamais dans le dépôt.
# Méthode et vérifications : docs/methode.md. Optimisations : docs/methode.md §10.

[main]
file_path = "../work/game/base/default.xex"
patch_file_path = "../work/game/tu2/default.xexp"
patched_file_path = "../work/game/patched/default.xex"
out_directory_path = "../work/out/ppc"
switch_table_file_path = "jump_tables.toml"   # généré par scripts/find_switches.py (+ switches_manual.toml)

# Optimisations (comme UnleashedRecomp) DÉSACTIVÉES le 18/11 : l'une d'elles fausse le décodeur vidéo du jeu (écran-titre
# en blocs depuis fe08cb5, j4 contrôle désormais ces blocs) et aucune n'apporte de cadence mesurable (vblank, jeu ≈ 3,6
# ms/image). Pour les réactiver : chercher l'option fautive une à une (docs/methode.md §10).
skip_lr = false                 # LR jamais lu comme donnée (1 blrl : cible prise au mtlr, patch)
skip_msr = false                # les 189 mfmsr ne servent qu'au mtmsrd suivant
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false   # r0 r2 r11 r12 f0 v32-v63
non_volatile_as_local = false   # r14-r31 f14-f31 v14-v31 v64-v127 ; setjmp : MSVC recharge après

# Funclets __finally de MSVC (lisent r12 et les registres non volatils de leur parent) et leurs
# appelants : registres gardés dans ctx, sinon RtlLeaveCriticalSection(0) et interblocage.
