# Builds the Windows and Linux launchers. A tag v* publishes a GitHub release with, per platform, the program
# alone (for players) and an archive for RecompLauncher. A manual run only uploads them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build make curl python3 zstd git
      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-win-${{ hashFiles('packaging/windows/deps.lock', 'tools.lock') }}
      - name: Build WakfuRecomp.exe
        run: packaging/windows/build-installer.sh "$PWD/build"
      - name: Build logs
        if: failure()
        run: for f in build/logs/*; do echo "== $f"; tail -40 "$f"; done
      - name: Package
        run: |
          VER=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || VER=0.0.0-dev
          packaging/recomplauncher/package.sh windows build/WakfuRecomp.exe "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        # the launcher embeds its font with --embed-dir (Clang 19+); Ubuntu 24.04 defaults to Clang 18
        run: |
          # X11 / Wayland / audio headers: build-paquet.sh builds the pinned SDL3 (static) for the launcher
          sudo apt-get update && sudo apt-get install -y clang-19 cmake ninja-build curl python3 zstd git zlib1g-dev libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang && sudo ln -sf /usr/bin/clang++-19 /usr/local/bin/clang++
          clang --version | head -1
      - name: Build the Linux launcher
        run: packaging/linux/build-paquet.sh "$PWD/build"
      - name: Build logs
        if: failure()
        run: for f in build/bld/*.log; do echo "== $f"; tail -40 "$f"; done
      - name: Package
        run: |
          VER=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || VER=0.0.0-dev
          packaging/recomplauncher/package.sh linux build/paquet/WakfuRecomp/WakfuRecomp "$VER" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/

  release:
    if: github.ref_type == 'tag'
    needs: [windows-x64, linux-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
          fi
