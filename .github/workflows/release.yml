# Builds WakfuRecomp.exe and the RecompLauncher zip. A tag v* publishes a GitHub release;
# a manual run only uploads the zip as a workflow artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build make curl python3 zstd git

      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: build/dl
          key: dl-${{ hashFiles('packaging/windows/deps.lock', 'tools.lock') }}

      - name: Build WakfuRecomp.exe
        run: packaging/windows/build-installer.sh "$PWD/build"

      - name: Package
        run: |
          VER=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || VER=0.0.0-dev
          packaging/recomplauncher/package.sh build/WakfuRecomp.exe "$VER" dist
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: wakfu-recomp-windows-x64
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
